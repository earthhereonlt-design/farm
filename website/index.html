<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisan Card Pro — Farmer ID Card Generator</title>
  <meta name="description" content="Free online tool to generate printable ISO CR-80 PVC Farmer ID cards (Kisan Cards) in multiple Indian languages with PDF, PNG and direct print export.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js for parsing uploaded environment PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    // Configure worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
  <style>
    html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; }
    * { box-sizing: border-box; }
    @media print {
      .no-print { display: none !important; }
      #print-area { display: grid !important; }
    }
  </style>
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
